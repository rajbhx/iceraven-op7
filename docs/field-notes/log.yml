# OP7 field-notes journal — machine-readable source of truth.
# The playbook repo (rajbhx/op7-special-build-playbook) regenerates its
# docs/09-field-notes-journey.md from this file automatically.
# Add an entry whenever a new problem is solved; keep it one-line-per-field.
sections:
  - id: A
    title: Build pipeline
    entries:
      - id: A1
        problem: "destination path 'upstream' already exists"
        cause: "workflow cloned into 'upstream/', a tracked dir of this repo"
        solution: "clone into 'mirror/' instead; keep clone dirs out of tracked paths"
      - id: A2
        problem: "removeUnusedEntriesOlderThan write-only property crash"
        cause: "gradle-build-action v3 cleanup incompatible with Gradle 9.5.1"
        solution: "pin gradle-build-action v2 (upstream-proven)"
        tags: [gradle, cache, github-actions]
      - id: A3
        problem: "APK not found (first time)"
        cause: "hardcoded AGP output path; ABI selection changes output layout"
        solution: "find-based discovery, name-agnostic"
      - id: A4
        problem: "APK not found (second time)"
        cause: "unsigned APKs named '*-forkRelease-unsigned.apk' (no signing config)"
        solution: "discovery handles '-unsigned'; sign step renames to .apk"
      - id: A5
        problem: "AAPT unexpected package id"
        cause: "OP7 patch appends '.iceraven.op7' to app id"
        solution: "expect the patched id; derive at runtime from patches + defaultConfig"
      - id: A6
        problem: "sign action 'build-tools not found'"
        cause: "action read ANDROID_HOME (runner SDK), we used ANDROID_SDK_ROOT (custom SDK)"
        solution: "compute BUILD_TOOLS_VERSION from ANDROID_HOME like upstream; read third-party action source before use"
      - id: A7
        problem: "GitHub cache service outage (400 / services unavailable)"
        cause: "GitHub-side transient"
        solution: "cache misses are warnings not failures; stable cache keys; next run restores"
      - id: A8
        problem: "R8 OOM risk with --parallel on 2-core/7 GB runner"
        cause: "workers vs heap"
        solution: "tune GRADLE_OPTS, limit --max-workers, keep release builds serial if flaky"
        tags: [r8, oom, memory, gradle]
      - id: A9
        problem: "'native-code' badging line missing"
        cause: "ABI selection ignored by some AGP versions"
        solution: "validation gates fail loudly; configure splits.abi explicitly"
      - id: A10
        problem: "Glean bootstrap (Miniconda3) not idempotent"
        cause: "wrapper re-downloaded every build"
        solution: "make bootstrap idempotent; skip when already present"
      - id: A11
        problem: "full build ~40 min on free runner"
        cause: "GeckoView AAR download + R8 + all ABIs"
        solution: "arm64-only split, Gradle/Rust/Maven caches, fast=true (no R8) for validation, --parallel when stable"
        tags: [build-time, caching, abi, free-tier]
      - id: A12
        problem: "Expo/RN build repos cannot use upstream's EAS-based CI"
        cause: "eas build --local needs EAS project ownership + EXPO_TOKEN"
        solution: "expo prebuild --platform android --no-install + plain gradle assemble"
        tags: [expo, rn, eas, github-actions]
      - id: A13
        problem: "Expo SDK 55 lockfile drift broke compile (@siteed/audio-studio 3.2.1)"
        cause: "fresh bun.lock resolved siteed 3.2.1 whose Promise.reject(String?,...)"
        solution: "pin @siteed/audio-studio=3.0.3 via overrides/bun.lock; verify compile"
        tags: [expo, bun, lockfile, compile-error]
      - id: A14
        problem: "ONNX InferenceSession leaked per denoise job (processing screen)"
        cause: "process.tsx creates DeepFilterNet and never calls release(); recording"
        solution: "OP7 patch 001 — release() in finally (stability fix, not perf claim)"
        tags: [onnx, memory-leak, stability]
      - id: A15
        problem: "rainManager APK has no native-code badging entry (lspatch libs in assets)"
        cause: "lspatch .so injected into patched Discord APK at patch time, not used by"
        solution: "validation gate for manager checks package/SDK/testOnly only"
        tags: [rain, lspatch, badging, abi]
  - id: B
    title: Release, signing, storage
    entries:
      - id: B1
        problem: "release asset became stale bytes"
        cause: "validation build overwrote release asset data"
        solution: "compare bytes; only update release asset from a validated release=true run"
      - id: B2
        problem: "PKCS12 alias mismatch risk"
        cause: "keystore alias vs secret"
        solution: "document exact alias; validate at first release"
      - id: B3
        problem: "release tag immutability"
        cause: "GitHub tags are immutable"
        solution: "fix version/tag in the dispatch; never reuse a tag"
      - id: B4
        problem: "APK commits sneaking into the repo"
        cause: "git add -A picked up 3x126 MB APKs in a gitignored dir (tracked before ignore added)"
        solution: "git rm --cached; verify git ls-files empty; keep binaries out of git history"
      - id: B5
        problem: "old artifacts/runs wasted the 500 MB quota"
        cause: "90-day default retention"
        solution: "monthly maintenance workflow prunes >14 d artifacts/caches, keeps newest 20 runs"
        tags: [storage, artifacts, cleanup]
  - id: C
    title: Device and install
    entries:
      - id: C1
        problem: "App not installed"
        cause: "APK flagged android:testOnly=true (Studio-injected build flag); Android 10 blocks UI installs"
        solution: "remove injected flag; splits.abi arm64-only; CI badging gate rejects testOnly; verify pm install -r without -t"
        tags: [install, testonly, abi, app-not-installed]
      - id: C2
        problem: "pm install -r from /sdcard/Download returns 255"
        cause: "opaque failure installing directly from FUSE path"
        solution: "copy to /data/local/tmp first, then pm install -r"
        tags: [install, shizuku, storage]
      - id: C3
        problem: "app open but Shizuku not connected"
        cause: "Shizuku server stopped or killed by battery optimization"
        solution: "shizuku whoami must print 'shell'; retry loops; user reopens Shizuku"
        tags: [shizuku, connection]
      - id: C4
        problem: "wrong activity launched in scripted runs"
        cause: "assistant app foreground; HOME keyevent ineffective in proot env"
        solution: "verify mCurrentFocus; use explicit component; validate LaunchState/Activity in logs"
        tags: [automation, activity, shizuku]
      - id: C5
        problem: "am start with HomeActivity failed (Error type 3: activity does not exist)"
        cause: "launcher activity is the Fenix delegate `.App`, and the package id is io.github.forkmaintainers.iceraven.op7 (not org.mozilla.fenix.iceraven.op7)"
        solution: "resolve the launcher with `cmd package resolve-activity --brief -c android.intent.category.LAUNCHER <pkg>` before launching"
        tags: [install, activity, package-id]
      - id: C6
        problem: "user asked to undo bulk per-user uninstalls on a daily-driver phone"
        cause: "cleanup removed 12 already-disabled packages via pm uninstall --user 0 without asking first"
        solution: "restore exactly via `pm install-existing --user 0 <pkg>` then `pm disable-user --user 0 <pkg>`; verify with `pm list packages -d` matches the original list. Rule: on a daily-driver, present a candidate list and get a go-ahead before uninstalling packages; files/app-data need explicit confirmation too"
        tags: [uninstall, restore, safety, daily-driver]
  - id: D
    title: Measurement and transfer
    entries:
      - id: D1
        problem: "am start -W returns TotalTime 0"
        cause: "activity still top-most; not a launch at all"
        solution: "background between runs; filter LaunchState: COLD; warm-start needs adb"
      - id: D2
        problem: "captured files empty (gfxinfo 0 B)"
        cause: "Shizuku wrapper races: large remote output streams to tty, local pipe gets 0 bytes"
        solution: "stage output to on-device temp file; pull with wc -c size probe + retry until sizes match"
        tags: [capture, shizuku, transfer, empty-output]
      - id: D3
        problem: "exit codes unreliable through Shizuku"
        cause: "wrapper mangles remote exit codes"
        solution: "verify by output content (pidof empty, 'Complete' marker)"
      - id: D4
        problem: "GitHub artifact downloads truncated (4+ aborts)"
        cause: "unreliable network"
        solution: "local python3 -m http.server loopback transfer; 131 MB in ~1.5 s; SHA-256 verify"
        tags: [transfer, artifact, checksum]
      - id: D5
        problem: "/sdcard files from shell unreadable by app proot"
        cause: "FUSE permission model; chmod unsupported"
        solution: "transfer via app-visible storage or MediaStore; verify sizes"
        tags: [shizuku, storage, permissions]
      - id: D6
        problem: "bsh stdout looks odd"
        cause: "returns JSON envelope {result,output}; no readAllBytes() (old Java)"
        solution: "parse JSON; read streams with BufferedReader loops"
      - id: D7
        problem: "warm-start impossible in proot env"
        cause: "HOME no-op; am finish and am task move-task-to-back unknown on this Android build; BACK intercepted"
        solution: "record as pending; needs adb or HOME-capable session"
        tags: [measurement, warm-start, adb]
      - id: D8
        problem: "dumpsys meminfo/gfxinfo returned 'No process found' or empty"
        cause: "app process was force-stopped by the preceding cold-start loop"
        solution: "launch the app and let it render BEFORE capturing mem/gfx (cmd_mem launches; run gfx after mem)"
        tags: [dumpsys, measurement, shizuku]
      - id: D9
        problem: "large dumpsys outputs (>40 KB) only partially pull through Shizuku"
        cause: "wrapper stdout race gets worse with payload size; 400 KB batterystats truncated at 82% after 15 retries"
        solution: "accept partial captures and label them, or use chunked pulls / adb / MediaStore for full captures"
        tags: [dumpsys, transfer, truncation]
      - id: D10
        problem: "proot files invisible to the real device shell (shizuku)"
        cause: "proot runs inside the app (gptos.intelligence.assistant); its /storage/emulated/0 is an app-private bind, not the real /sdcard"
        solution: "proot shares the device network, so serve the APK with a persistent loopback HTTP server (setsid nohup python3 -m http.server) and pull with curl on the real shell to /sdcard/Download/op7/; verify size; copy to /data/local/tmp then pm install -r"
        tags: [transfer, shizuku, sdcard, loopback]
      - id: D11
        problem: "verify GeckoView uses hardware video decoding before touching media prefs"
        cause: "hardware decoders exist (Phase 5) but usage was unverified; changing prefs on assumptions is banned by the golden rule"
        solution: "media_probe.sh — force-stop, clear logcat, open a direct 1080p clip in Iceraven, sample top every 4s, dump logcat + dumpsys media.player; GeckoView's HardwareCodecCapability log names the selected decoder"
        tags: [media, codec, verification, cpu]
      - id: D12
        problem: "summary CPU parse showed a fake 1034% spike in the probe"
        cause: "naive grep of leading digits grabbed the wrong column from top output"
        solution: "report peak from raw per-process samples; verify against cpu-all.txt before trusting a number"
        tags: [measurement, cpu, parsing]
      - id: D13
        problem: "\"3/6/10 tabs\" memory captures were invalid — no new tabs were actually opened"
        cause: "repeated `am start -a VIEW -d <url>` on an already-foreground Fenix reuses the existing tab/task instead of creating new tabs; user confirmed no new tabs appeared"
        solution: "validate tab creation before measuring (uiautomator dump + user observation); VIEW-intent counts are not tab counts. Correct path: user opens tabs manually, or tap the real \"New tab\" toolbar node (from the Iceraven a11y dump) then drive the awesome bar"
        tags: [tabs, measurement, intent, ui-automation]
      - id: D14
        problem: "a11y dumps can show the WRONG app — the gptos assistant overlay, not the browser"
        cause: "the assistant host app renders its own floating UI on top; `uiautomator dump` captured that package's nodes"
        solution: "grep the dump for package=\"...iceraven...\" and confirm mCurrentFocus before trusting coordinates/taps"
        tags: [shizuku, ui-automation, overlay]
      - id: D15
        problem: "needed real per-tab memory data but VIEW intents cannot create tabs in a foreground Fenix"
        cause: "repeated VIEW intents reuse the current tab (see D13); UI automation is blocked by the host app overlay (D14)"
        solution: "collaborative measurement — user opens 3/6/10 tabs by hand, `baseline_capture.sh state <n>` captures meminfo + processes as-is without force-stop"
        tags: [tabs, memory, measurement, collaboration]
      - id: D16
        problem: "browser restarted between captures, changing the main pid and invalidating one sample"
        cause: "app instance churn mid-test (no crash logged); transient"
        solution: "use only settled states; verify pid + process set consistency before trusting a capture; retry truncated meminfo captures (146-byte truncation seen once)"
        tags: [measurement, meminfo, stability]
      - id: D17
        problem: "\"Remote debugging via USB\" enabled but port 6000 not listening"
        cause: "GeckoView's remote debugger listens on a Unix abstract socket (io.github.forkmaintainers.iceraven.op7/firefox-debugger-socket), not TCP; adb forward is the normal bridge"
        solution: "verified via logcat `GeckoViewRemoteDebugger: listening on .../firefox-debugger-socket`"
        tags: [devtools, debugging, socket, geckoview]
      - id: D18
        problem: "cannot reach the abstract socket without adb"
        cause: "SELinux denies the proot app domain (EACCES on connect); shell toybox nc has no -U; user declined adb authorization"
        solution: "accept the constraint — devtools measurement channel is unavailable on this setup; keep Shizuku dumpsys/top/logcat as the measurement stack"
        tags: [devtools, selinux, adb, constraint]
      - id: D19
        problem: "C1 'verified' was wrong — codec enumeration is not playback"
        cause: "r5 probe logged HardwareCodecCapability decoder selection + low CPU, but the probe clip URLs were 404, so no MediaCodec session ever ran; 'verified' was inferred, not observed"
        solution: "prove playback three ways: (1) fixture page beacons currentTime to a local HTTP server every 2 s (time-series must advance), (2) logcat must show a live MediaCodec session (OMX.qcom.video.decoder.*, component_init success, surface generation set) in our media pid, (3) user confirms video visible on screen"
        tags: [media, codecs, c1, verification, honest-benchmark]
      - id: D20
        problem: "muted video never plays when tab goes background; decoder deinit on backgrounding"
        cause: "Gecko pauses muted background media (correct energy behavior); audible media keeps playing with decoder alive"
        solution: "for background-capable media tests: let the page unmute+play on a user tap (autoplay policy), then capture dumpsys/logcat from the agent side while user keeps chatting"
        tags: [media, background, energy, autoplay]
      - id: D21
        problem: "VIEW intent on already-running Fenix task does not deliver the URL"
        cause: "am start -n on a foreground activity logs 'Activity not started' and only brings the task forward; new tab was never fetched (background tabs don't fetch until foregrounded)"
        solution: "cold-start reliably: am force-stop, then am start with the intent; or let the chooser resolve (no -n); drive navigation by tapping the URL bar + input text + keyevent 66"
        tags: [intents, fenix, navigation, tabs]
      - id: D22
        problem: "alias URL http://127.0.0.1:8790/s rendered a blank page in Iceraven"
        cause: "the alias file 's' has no extension; python http.server serves it as application/octet-stream, and Gecko refuses to render a binary blob as HTML — page fetches 200 but shows nothing, JS never runs"
        solution: "always give fixture files a .html extension (or set MIME) — check Content-Type before relying on a local fixture; blank page + 200 = wrong MIME, not a browser bug"
        tags: [media, fixtures, mime, http, debugging]
      - id: D23
        problem: "dumpsys gfxinfo <pkg> framestats showed 0 frames while the page was actively scrolling"
        cause: "gfxinfo measures only the main process; WebRender content renders in :tab_* and :gpu processes, so page frames never appear in the package's gfxinfo"
        solution: "measure compositor-level smoothness with dumpsys SurfaceFlinger --latency '<pkg>/<activity>#0' (line 1 = refresh ns, rows = desired/actual/ready); only judge deltas during continuous motion (idle gaps are not jank)"
        tags: [smoothness, framestats, surfaceflinger, measurement]
      - id: D24
        problem: "intent-opened URL tab never ran JS (no beacons) and showed blank/frozen"
        cause: "cold start with VIEW intent restores the old session in front and adds the URL tab in the background; background tabs suspend JS timers/rAF until foregrounded"
        solution: "foreground-only web tests: have the user paste the URL in the address bar (works reliably), or use the chooser route; don't expect the intent tab to run until it is the active tab"
        tags: [tabs, background, intent, foreground, gecko]
      - id: D25
        problem: "SurfaceFlinger --latency on ...HomeActivity#0 gave sparse frames (11) and fake jank while the page clearly scrolled"
        cause: "the #0 layer is the activity/chrome surface; GeckoView web content composites into the child SurfaceView layer, which only exists while the browser is visible"
        solution: "capture dumpsys SurfaceFlinger --latency with the SurfaceView layer name from --list (SurfaceView - <pkg>/<activity>#0); verify the surface is active (many frames) before trusting jank numbers; gfxinfo <pkg> = chrome only"
        tags: [surfaceflinger, surfaceview, smoothness, layers, measurement]
      - id: D26
        problem: "am start -W failed with Binder 'Failed transaction (2147483646)' and HOT launches during cold-start re-measurement"
        cause: "rapid force-stop + start cycles under system contention (daily driver in use) hit Binder transaction failures; force-stop needs settle time or the old process survives"
        solution: "measure cold start as single commands: force-stop, sleep 3, verify no pid, then am start -W; confirm LaunchState: COLD per run; label contended samples honestly"
        tags: [startup, cold-start, binder, measurement, contention]
      - id: D27
        problem: "C4/C5 smoothness numbers were captured on the wrong layer (activity window, not WebRender content)"
        cause: "gfxinfo reports only the main process (UI thread); the real content layer is a SurfaceView under HomeActivity#0"
        solution: "verify via `dumpsys SurfaceFlinger --list` — confirmed `SurfaceView - ...HomeActivity#0`; use SurfaceFlinger latency for content frame timing"
        tags: [smoothness, surfaceflinger, layer, measurement]
  - id: E
    title: CI quality
    entries:
      - id: E1
        problem: "CI red after merge"
        cause: "shellcheck SC2129 (individual >> redirects to summary)"
        solution: "group echos with { ...; } >> file"
      - id: E2
        problem: "testOnly gate missing"
        cause: "validation gap"
        solution: "badging step fails when testOnly=true appears"
      - id: E3
        problem: "scheduled workflow 60-day caveat"
        cause: "GitHub policy for public repos"
        solution: "daily check + dispatch + monthly maintenance reset the activity window; manual/repo-dispatch secondary"
      - id: E4
        problem: "r3 build failed at app:compileForkReleaseKotlin"
        cause: "missing import for DeviceCapabilities in HomeActivity; PackageManager.getSystemFeatureInfo/FEATURE_OPENGLES_* unresolved in this module (used deviceConfigurationInfo.reqGlEsVersion instead)"
        solution: "review imports before shipping a patch; prefer deviceConfigurationInfo for GLES version; ALWAYS re-stage BOTH files before regenerating a patch (git reset unstaged them and the regenerated patch silently lost the HomeActivity hunks)"
        tags: [kotlin, compile, patch]
      - id: E5
        problem: "r3 build failed at app:compileForkReleaseKotlin (Unresolved references)"
        cause: "missing DeviceCapabilities import in HomeActivity; PackageManager feature APIs unresolved in this module"
        solution: "added import; use deviceConfigurationInfo.reqGlEsVersion for GLES; review imports/APIs before dispatching"
        tags: [kotlin, compile, patch, imports]
      - id: E6
        problem: "full 40-min build wasted on a compile error"
        cause: "dispatched full build before local review of the Kotlin patch"
        solution: "use fast=true validation builds during patch iteration (compile-level proof, cheap); full R8 only when ready"
        tags: [build-time, validation, fast-build]
      - id: E7
        problem: "regenerated patch silently lost hunks after git reset"
        cause: "git reset unstaged files; regenerated diff from only one staged file"
        solution: "always re-stage ALL touched files before regenerating a patch; verify patch touches expected files (grep '^diff --git')"
        tags: [patch, git, regeneration]
      - id: E8
        problem: "generated patch 005 lost its `diff --git`/`index` header on first write"
        cause: "`sed '1,2d'` stripped the ---/+++ pair before the header replacement could run"
        solution: "insert header before first hunk; verify with `git apply --check` on a fresh post-004 checkout, then full 001→005 sequence on a clean worktree"
        tags: [patch, git-apply, generation]
      - id: E9
        problem: "`git add -A` staged a 148 MB APK even though `.gitignore` listed `op7apk/`"
        cause: "gitignore does NOT support inline comments — `op7apk/  # comment` makes the whole line a pattern that never matches; only `#` on its own line is a comment"
        solution: "move comments to their own lines; verify with `git check-ignore -v <path>` before committing large files"
        tags: [gitignore, git, large-files, apk, footgun]
      - id: E10
        problem: "handoff theory (\"settings rows sit on container_low/lowest\") was wrong for the main list"
        cause: "Preference styleable has no android:background; preference_material.xml root uses only selectableItemBackground ripple; PreferenceFragmentCompat draws rows over colorBackground with a #1f000000 divider"
        solution: "verified against androidx.preference 1.2.1 AAR (preference-1.2.1.aar) + upstream fenix styles.xml before patching; fixed the actual structure carriers (row surface + dividers) instead of only tokens"
        tags: [root-cause, androidx, resources]
      - id: E11
        problem: "regenerating patch 005 needed real upstream blob hashes"
        cause: "r5 patch's index lines were hand-assembled (before-hash d74cdcb ≠ upstream blob cee5b72)"
        solution: "rebuilt 005 from pristine upstream files in a scratch git repo so index lines are true content hashes; verified git apply --check on fresh baseline and after 004; result files byte-identical to intended state"
        tags: [patch, git-apply, generation]
      - id: E12
        problem: "005 and 006 both edit values-night/colors.xml — risk of inter-patch hunk overlap breaking the sequence"
        cause: "sequential git apply needs non-overlapping context lines"
        solution: "generated 005 v3 and 006 as separate commits in a scratch git repo from pristine upstream files, exported real-blob diffs, then verified on a fresh baseline: 005 check+apply OK, 006 check+apply OK, final tree byte-identical to target; no overlap (005 hunks at lines 17-60, 006 at 4-11 + 95-119)"
        tags: [patch-generation, git-apply, validation]
      - id: E13
        problem: "005 v3 failed in CI at values-night/colors.xml:39 while local pristine-file verification passed"
        cause: "CI applies patches AFTER 004 (seamless launch) and the Iceraven patch layer; 004 already rewrites the splash line (#210340 -> @color/fx_mobile_surface), so 005's combined hunk that edited the same line could not match"
        solution: "005 no longer touches the splash line — 004 references fx_mobile_surface, which 005 remaps to novaBlack, so the splash is pure black by reference; re-verified the CI order (pristine -> 004 -> 005 -> 006) in a scratch repo, tree byte-identical to target"
        tags: [patch-order, ci, 004-ownership, splash]
  - id: F
    title: UI / perceived performance
    entries:
      - id: F1
        problem: "visible color jump between splash and home screen on launch"
        cause: "hard-coded splash brand color (#FCF3EE / #210340) differs from home surface (#F7F6FB / #1D1B1F)"
        solution: "splash background references @color/fx_mobile_surface (patch 004) — seamless iOS-style launch, cosmetic only"
        tags: [splash, theming, perceived-performance]
      - id: F2
        problem: "dark theme uses dark-grey surfaces (#1d1b1f/#312f33), not true black, so AMOLED pixels stay lit"
        cause: "values-night/colors.xml maps Material3 surface tokens to novaGray65-85 / photonDarkGrey30/80"
        solution: "patch 005 remaps surfaces to #000000 scale with subtle elevation steps (#070707-#242424); contrast 18.6:1 preserved; light theme untouched"
        tags: [amoled, dark-theme, colors, battery, resource-only]
      - id: F3
        problem: "after r5 AMOLED patch, the browser Settings page rendered as a pure-black void (\"Only browser settings page black\")"
        cause: "androidx.preference rows are transparent ripples over the activity colorBackground (fx_mobile_background = #000000) and its list divider is #1f000000 (invisible on black); no container token reaches the rows, so raising container_low/lowest alone would NOT fix the main settings list"
        solution: "r6 gives preference rows a real card surface — new @layout/op7_preference_row (derived from androidx preference_material 1.2.1, inset 12dp card, rounded 12dp, fill ?attr/colorSurfaceContainer = #1A1A1A = home-card tone) wired via PreferenceTheme.preferenceStyle + SwitchCompatPreferenceMaterialStyle; androidx list dividers neutralized (transparent) so full-width lines don't cross card gaps; container scale lifted off pure black (lowest #0A0A0A < low #121212 < container #1A1A1A < high #1F1F1F < highest #242424) so Compose sub-screens using colorSurfaceContainer* stay visible; background/surface/dim stay true black"
        tags: [amoled, settings, preferences, theme, colors, resource-only, r6]
      - id: F4
        problem: "user rejected r6 as \"a mix of gray and pureblack\" (screenshot showed #1A1A1A card rows on the pure-black Settings page)"
        cause: "r6 container scale lifted off pure black (lowest #0A0A0A < container #1A1A1A < highest #242424) plus layer_color_2/3 and outline tokens still referenced dark greys; every content surface was lit gray on black"
        solution: "r7 collapses the ENTIRE dark-theme surface scale to #000000 (background/surface/dim/surface_variant/surface_bright, all surface_container_*, layer_color_2, layer_color_3, splash #210340->#000000) and carries structure with hairlines instead of lit fills: outline #2A2A2A, outline_variant #242424, settings row card gets a 1dp #242424 stroke around its pure-black fill (op7_preference_row_background); result = true pure-black everywhere with cards still distinguishable"
        tags: [amoled, pureblack, theme, hairlines, resource-only, r7]
      - id: F5
        problem: "user wants the browser to feel OnePlus-branded, not Mozilla-violet"
        cause: "fx_mobile_primary + dark-mode accent family map to nova/photon violet palette in values/colors.xml and values-night/colors.xml"
        solution: "new 006-op7-onephone-red-accent.patch remaps the accent family to OnePlus red #EB0029 (night primary #EB0029, primary_container #FF4D000F, primary_inverse #FFFF3346, accent_normal_theme #EB0029, high-contrast #FFFF3346, fill-link/cursor/dashboard progress #EB0029; day primary #EB0029, container #FFFFD9DE, inverse #FFFF4D5E); private-mode violet identity kept intact; day accent_normal_theme untouched because it is text color (photonInk20), not brand accent"
        tags: [onephus, brand, red-accent, colors, r7]
      - id: F7
        problem: "playbook sync failed parsing project field-notes logs"
        cause: "unquoted YAML scalars containing ': ' broke generate_project_docs.py"
        solution: "quote all scalar values in docs/field-notes/log.yml"
        tags: [playbook, yaml, field-notes]
