name: OP7 Build

# Full Iceraven OP7 pipeline (Phases 3, 9).
# - Mirrors the pinned upstream commit (or an explicit one), applies the Iceraven
#   patch layer (as upstream CI does), then applies the OP7 patch set.
# - Any patch conflict STOPS the pipeline before build/release (never auto-resolves).
# - Validation gates: source sync, patch apply, dependency resolution, compile,
#   APK structural validity, ABI check, checksums, metadata.
# - release=true additionally requires passing quality gates and publishes a GitHub
#   Release from the `release` job, which is the ONLY job with access to the release
#   keystore secrets and runs under the `release` environment.
#
# Security: workflow_dispatch only (maintainers). PRs from untrusted forks never
# reach this workflow or its secrets.

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Upstream commit to build (default: pinned in upstream/commit.txt)'
        required: false
        default: ''
      abi:
        description: 'Target ABI (OP7 build is arm64-v8a only; other values fail validation)'
        required: false
        default: 'arm64-v8a'
      patch_ref:
        description: 'Ref of this repo to test (e.g. refs/pull/42/head); default = default branch'
        required: false
        default: ''
      release:
        description: 'Create a GitHub Release (requires release_tag + release secrets)'
        required: false
        default: 'false'
      release_tag:
        description: 'Release tag, format op7-<iceraven-version>-r<rev> (required if release=true; auto-generated from version+revision when omitted and auto_release=true)'
        required: false
        default: ''
      auto_release:
        description: 'Auto-publish a release after ALL quality gates pass (used by the upstream-sync path); requires the release secrets; never combine with fast=true'
        required: false
        default: 'false'
      fast:
        description: 'Fast validation build (skips R8/shrink via -PdisableOptimization); use for iteration, NOT for release evidence'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: op7-build-${{ github.event.inputs.upstream_commit || 'pinned' }}
  cancel-in-progress: false

jobs:
  build:
    name: Mirror, patch, build, validate
    runs-on: ubuntu-latest
    outputs:
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      release: ${{ steps.release.outputs.release }}
      release_tag: ${{ steps.release.outputs.release_tag || steps.resolve.outputs.release_tag }}
      apk_name: ${{ steps.validate.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.patch_ref || '' }}
          fetch-depth: 0

      - name: Resolve upstream commit and release inputs
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.upstream_commit }}" ]]; then
            UPSTREAM_COMMIT="${{ github.event.inputs.upstream_commit }}"
          else
            UPSTREAM_COMMIT="$(cat upstream/commit.txt)"
          fi
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream commit: $UPSTREAM_COMMIT"

          RELEASE="${{ github.event.inputs.release }}"
          if [[ "$RELEASE" == "true" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [[ -z "$TAG" ]]; then
              echo "::error::release=true requires release_tag (format op7-<iceraven-version>-r<rev>)"
              exit 1
            fi
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream at pinned commit
        run: |
          UPSTREAM_COMMIT="${{ steps.resolve.outputs.upstream_commit }}"
          git clone --filter=blob:none --recurse-submodules \
            https://github.com/fork-maintainers/iceraven-browser.git mirror
          git -C mirror checkout "$UPSTREAM_COMMIT"
          echo "upstream commit: $(git -C mirror rev-parse HEAD)"
          echo "iceraven version: $(cat mirror/version.txt)"
          echo "geckoview buildid: $(grep -oP 'MOZ_BUILDID\s+\K[0-9]+' mirror/buildid.h)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK (upstream script)
        run: |
          cd mirror
          ./automation/iceraven/install-sdk.sh
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk/android-sdk-linux" >> "$GITHUB_ENV"

      - name: Apply Iceraven patch layer (as upstream CI does)
        run: |
          cd mirror
          ./automation/iceraven/patch_android_components.sh
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Apply OP7 patches (fails closed on conflict)
        run: |
          cd mirror
          OP7_LAYER_DIR="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/automation/op7/apply_patches.sh"

      - name: Collect build metadata
        id: metadata
        run: |
          VERSION_TXT="$(cat mirror/version.txt | tr -d '[:space:]')"
          BUILDID="$(grep -oP 'MOZ_BUILDID\s+\K[0-9]+' mirror/buildid.h)"
          REV="$(cat op7-revision.txt | tr -d '[:space:]')"
          GIT_DESCRIBE="$(git -C mirror describe --tags HEAD 2>/dev/null || echo "$VERSION_TXT")"
          VERSION_NAME="${GIT_DESCRIBE}-op7r${REV}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "OP7_VERSION_NAME=$VERSION_NAME"
            echo "OP7_ICERAVEN_VERSION=$VERSION_TXT"
            echo "OP7_GECKOVIEW_ARTIFACT=org.mozilla.geckoview:geckoview-omni:${VERSION_TXT}.${BUILDID}"
            echo "OP7_AC_VERSION=$VERSION_TXT"
            echo "OP7_PATCH_REVISION=$REV"
            echo "OP7_ABI=${{ github.event.inputs.abi }}"
            echo "OP7_ANDROID_TARGET=36"
            echo "OP7_UPSTREAM_BRANCH=iceraven"
          } >> "$GITHUB_ENV"
          echo "version: $VERSION_NAME"

      - name: Resolve release target (auto or explicit)
        id: release
        if: github.event.inputs.release == 'true' || github.event.inputs.auto_release == 'true'
        run: |
          if [[ "${{ github.event.inputs.fast }}" == "true" ]]; then
            echo "::error::release/auto_release cannot be combined with fast=true (fast skips R8; not release evidence)"
            exit 1
          fi
          REV="$(tr -d '[:space:]' < op7-revision.txt)"
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            BASE="${OP7_VERSION_NAME%-op7r"${REV}"}"
            BASE="${BASE#v}"
            TAG="op7-${BASE}-r${REV}"
          fi
          if [[ -z "$TAG" || "$TAG" == op7--r* ]]; then
            echo "::error::could not derive a valid release tag (version='$OP7_VERSION_NAME' revision='$REV' input='${{ github.event.inputs.release_tag }}')"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release target: $TAG"

      - name: Build forkRelease (OP7 ABI)
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        uses: gradle/gradle-build-action@v2
        with:
          build-root-directory: mirror
          gradle-home-cache-cleanup: true
          gradle-home-cache-excludes: |
            glean
          arguments: |
            app:assembleForkRelease
            -PversionName=${{ steps.metadata.outputs.version_name }}
            --build-cache
            -I "${{ github.workspace }}/automation/op7/clean-glean-bootstrap.groovy"
            ${{ github.event.inputs.fast == 'true' && '-PdisableOptimization' || '' }}
            --stacktrace
            --no-daemon

      - name: Validate APK (structural + ABI)
        id: validate
        run: |
          APK="$(find mirror -type f -name 'app-*-forkRelease*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "::error::no forkRelease APK found (ABI=${{ github.event.inputs.abi }})"
            find mirror -type f -name '*.apk' 2>/dev/null | head -n 20 || true
            exit 1
          fi
          APK_DIR="$(dirname "$APK")"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          if [[ "$APK" == *-unsigned.apk ]]; then
            SIGNED_PATH="${APK%-unsigned.apk}.apk"
          else
            SIGNED_PATH="$APK"
          fi
          echo "SIGNED_PATH=$SIGNED_PATH" >> "$GITHUB_ENV"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"
          ls -la "$APK_DIR" || true
          SIGN_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_VERSION="$(find "$SIGN_SDK/build-tools/" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "using build-tools $BUILD_TOOLS_VERSION @ $SIGN_SDK"
          BADGING="$("$SIGN_SDK/build-tools/$BUILD_TOOLS_VERSION/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 8
          BASE_ID="$(grep -m1 -E '^\s*applicationId "' mirror/app/build.gradle | sed -E 's/.*applicationId "([^"]+)".*/\1/')"
          OP7_SUFFIX="$(grep -h '^+.*applicationIdSuffix' patches/op7/*.patch | sed -E 's/.*applicationIdSuffix "([^"]+)".*/\1/' | tail -n 1)"
          EXPECTED_ID="${BASE_ID}${OP7_SUFFIX}"
          if [[ -z "$BASE_ID" || -z "$OP7_SUFFIX" ]]; then
            echo "::error::could not derive expected package id (base='$BASE_ID' suffix='$OP7_SUFFIX')"
            exit 1
          fi
          echo "expect package: $EXPECTED_ID"
          echo "$BADGING" | grep -q "package: name='${EXPECTED_ID}'" \
            || { echo "::error::unexpected package id (expected $EXPECTED_ID)"; exit 1; }
          echo "$BADGING" | grep -q "sdkVersion:'26'" \
            || { echo "::error::minSdk mismatch, expected 26"; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'36'" \
            || { echo "::error::targetSdk mismatch, expected 36"; exit 1; }
          echo "$BADGING" | grep -q "native-code: '${{ github.event.inputs.abi }}'" \
            || { echo "::error::ABI mismatch, expected ${{ github.event.inputs.abi }}"; exit 1; }
          if ! unzip -l "$APK" | grep -q "lib/${{ github.event.inputs.abi }}/"; then
            echo "::error::no native libs for ${{ github.event.inputs.abi }}"
            exit 1
          fi
          if "$SIGN_SDK/build-tools/$BUILD_TOOLS_VERSION/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'testOnly'; then
            echo "::error::APK is android:testOnly=true; Android blocks UI installs (do NOT use -Pandroid.injected.build.abi; build via splits.abi)"
            exit 1
          fi
          sha256sum "$APK" | tee SHA256SUMS.txt
          echo "VALIDATION PASSED for $APK"

      - name: Write build metadata
        run: |
          "$GITHUB_WORKSPACE/automation/op7/write_build_metadata.sh" build-metadata.json

      - name: Upload unsigned APK + validation artifacts (release builds only; needed to sign with the release key)
        if: github.event.inputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: op7-validation-${{ steps.metadata.outputs.version_name }}
          path: |
            ${{ env.APK_PATH }}
            SHA256SUMS.txt
            build-metadata.json
          retention-days: 7

      - name: Debug-sign APK (validation builds only)
        if: github.event.inputs.release != 'true'
        uses: abhijitvalluri/sign-apks@v0.8
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
        with:
          releaseDirectory: ${{ env.APK_DIR }}/
          signingKeyBase64: ${{ secrets.DEBUG_SIGNING_KEY }}
          alias: ${{ secrets.DEBUG_ALIAS }}
          keyStorePassword: ${{ secrets.DEBUG_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Upload debug-signed APK (validation builds only)
        if: github.event.inputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: op7-signed-${{ steps.metadata.outputs.version_name }}
          path: ${{ env.SIGNED_PATH }}
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'
          ## OP7 build report
          - upstream commit: `${{ steps.resolve.outputs.upstream_commit }}`
          - version name: `${{ steps.metadata.outputs.version_name }}`
          - ABI: `${{ github.event.inputs.abi }}`
          - patch status: applied by `automation/op7/apply_patches.sh` (fail = stopped before build)
          - validation: aapt badging + native-lib ABI check + testOnly gate + SHA-256
          - release mode: ${{ github.event.inputs.release }} (auto_release: ${{ github.event.inputs.auto_release }})
          - fast mode (no R8): ${{ github.event.inputs.fast }}
          SUMMARY

  release:
    name: Sign with release key and publish
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Guard release tag and secrets
        run: |
          if [[ -z "${{ needs.build.outputs.release_tag }}" ]]; then
            echo "::error::release tag is missing; refusing to publish"
            exit 1
          fi
          for SECRET in OP7_RELEASE_KEYSTORE_BASE64 OP7_RELEASE_KEYSTORE_PASSWORD OP7_RELEASE_KEY_ALIAS OP7_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!SECRET:-}" ]]; then
              echo "::error::$SECRET is not configured; refusing to publish"
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: op7-validation-${{ needs.build.outputs.version_name }}
          path: release-artifacts

      - name: Setup build tool version variable
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_VERSION="$(find "$SDK_ROOT/build-tools/" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "using build-tools $BUILD_TOOLS_VERSION"

      - name: Sign APK with dedicated release key
        uses: abhijitvalluri/sign-apks@v0.8
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
        with:
          releaseDirectory: release-artifacts/
          signingKeyBase64: ${{ secrets.OP7_RELEASE_KEYSTORE_BASE64 }}
          alias: ${{ secrets.OP7_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.OP7_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.OP7_RELEASE_KEY_PASSWORD }}

      - name: Final checksums and metadata
        run: |
          cd release-artifacts
          rm -f ./*-unsigned.apk
          ls -la
          sha256sum ./*.apk | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "Iceraven OP7 ${{ needs.build.outputs.version_name }}"
          body: |
            ## Iceraven OP7 release

            - upstream commit: `${{ needs.build.outputs.upstream_commit }}`
            - version: `${{ needs.build.outputs.version_name }}`
            - target ABI: `${{ github.event.inputs.abi }}`
            - artifacts: APK + `SHA256SUMS.txt` + `build-metadata.json`
            - signed with the dedicated release key (GitHub `release` environment)
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
            release-artifacts/build-metadata.json
          fail_on_unmatched_files: true

      - name: Write job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'
          ## Release published
          - tag: `${{ needs.build.outputs.release_tag }}`
          - artifacts signed with the release key and attached to the GitHub Release.
          SUMMARY
